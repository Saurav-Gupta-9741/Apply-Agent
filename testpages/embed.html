<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Careers at Acme (embedded application, local test page)</title></head>
<body style="font:15px system-ui;max-width:760px;margin:32px auto;padding:0 16px">
  <h1>Careers at Acme</h1>
  <p>Our application form is embedded below, the way many company sites embed their job board.
    <code>?frame=http://127.0.0.1:8181/apply.html</code> embeds it from another local site.</p>
  <iframe id="app-frame" src="apply.html" style="width:100%;height:1400px;border:1px solid #ccc"></iframe>
  <script>
    // Only local practice pages may be embedded.
    const frame = new URLSearchParams(location.search).get("frame");
    if (frame && /^http:\/\/(127\.0\.0\.\d|localhost):8181\/[\w.-]+\.html(\?[\w=&]*)?$/.test(frame)) {
      document.getElementById("app-frame").src = frame;
    }
  </script>
</body>
</html>
