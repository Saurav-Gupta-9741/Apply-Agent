<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Data Engineer - Northwind</title></head>
<body>
<h1>Data Engineer</h1>
<form id="f">
  <label for="fn">First name</label><input id="fn" name="first_name" required>
  <label for="em">Email</label><input id="em" name="email" type="email" required>
  <label for="why">Why do you want to join Northwind? (max 150 words)</label>
  <textarea id="why" name="why" required></textarea>
  <label for="proud">Tell us about a project you are proud of. </label>
  <textarea id="proud" name="proud" required></textarea>

  <button type="submit">Submit</button>
</form>
</body>
</html>
