<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ApplyAgent">
<defs>
  <linearGradient id="aa-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6E70F8"/><stop offset=".55" stop-color="#8E6CF7"/><stop offset="1" stop-color="#AE6BF3"/>
  </linearGradient>
  <radialGradient id="aa-shine" cx=".28" cy=".1" r=".95">
    <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <filter id="aa-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#2E1A7A" flood-opacity=".45"/>
  </filter>
</defs>
<style>
    .tile { transform-origin: 64px 64px; animation: tile-in .42s cubic-bezier(.2,.9,.25,1.25) both; }
    .legs { stroke-dasharray: 100; animation: draw .5s .28s cubic-bezier(.65,0,.35,1) both; }
    .tick { stroke-dasharray: 100; animation: draw .34s .72s cubic-bezier(.3,0,.2,1) both; }
    .tick-g { transform-origin: 62px 74px; animation: pop .36s 1.02s cubic-bezier(.3,1.6,.5,1) both; }
    .spark { transform-origin: 101px 27px; animation: spark-in .5s 1.05s cubic-bezier(.3,1.5,.5,1) both; }
    @keyframes tile-in { from { transform: scale(.82); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes pop { 0% { transform: none; } 45% { transform: scale(1.16); } 100% { transform: none; } }
    @keyframes spark-in { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<g class="tile">
  <rect width="128" height="128" rx="30" fill="url(#aa-bg)"/>
  <rect class="shine" width="128" height="128" rx="30" fill="url(#aa-shine)"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
  
  <g filter="url(#aa-shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="legs" d="M38 98 L64 32 L90 98" pathLength="100" stroke="#FFFFFF" stroke-width="13"/>
    <g class="tick-g">
      <path class="tick" d="M49 74.5 L59 84 L79 63" pathLength="100" stroke="#7CF0C5" stroke-width="11.5"
        />
    </g>
  </g>
  <path class="spark" d="M101 17 C102.2 23.6 104.4 25.8 111 27 C104.4 28.2 102.2 30.4 101 37 C99.8 30.4 97.6 28.2 91 27 C97.6 25.8 99.8 23.6 101 17 Z" fill="#fff"/>
</g>
</svg>