<!-- Real application form, saved by e2e/coverage.spec.ts (scripts and styles removed). -->
<h1>Principal Cloud Solutions Architect - Azure Core</h1>
<div class="iCIMS_JobContent">
  <div class="iCIMS_PortalSection">
    <form id="icims_candidate_form" method="post">
      <div class="iCIMS_SubHeader iCIMS_SubHeader_Combined">Candidate Profile</div>
      <table class="iCIMS_InfoTable iCIMS_Table">
        <tbody>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3001">First Name <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="text" id="rcf_3000_3001" name="rcf_3000_3001" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3002">Last Name <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="text" id="rcf_3000_3002" name="rcf_3000_3002" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3003">Email Address <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="email" id="rcf_3000_3003" name="rcf_3000_3003" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3004">Phone Number <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="tel" id="rcf_3000_3004" name="rcf_3000_3004" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3005">Street Address <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="text" id="rcf_3000_3005" name="rcf_3000_3005" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3006">City <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="text" id="rcf_3000_3006" name="rcf_3000_3006" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3007">State <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="text" id="rcf_3000_3007" name="rcf_3000_3007" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_3000_3008">Postal Code <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="text" id="rcf_3000_3008" name="rcf_3000_3008" required value="" /></td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_resume">Resume / CV Attachment <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell"><input type="file" id="rcf_resume" name="rcf_resume" required accept=".pdf,.doc,.docx" /></td>
          </tr>
        </tbody>
      </table>

      <div class="iCIMS_SubHeader iCIMS_SubHeader_Combined">Security Clearance & Compliance</div>
      <table class="iCIMS_InfoTable iCIMS_Table">
        <tbody>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_clearance">Do you possess an active US Government Security Clearance? <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell">
              <select id="rcf_clearance" name="rcf_clearance" required>
                <option value="">Select option...</option>
                <option value="none">None</option>
                <option value="secret">Secret</option>
                <option value="top_secret">Top Secret / SCI</option>
              </select>
            </td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_work_auth">Are you legally authorized to work in the United States? <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell">
              <select id="rcf_work_auth" name="rcf_work_auth" required>
                <option value="">Select option...</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </td>
          </tr>
          <tr class="iCIMS_TableRow">
            <td class="iCIMS_TableHeader"><label for="rcf_sponsorship">Will you now or in the future require visa sponsorship? <span class="iCIMS_Asterisk">*</span></label></td>
            <td class="iCIMS_TableCell">
              <select id="rcf_sponsorship" name="rcf_sponsorship" required>
                <option value="">Select option...</option>
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="iCIMS_ButtonBlock">
        <input type="submit" id="btn_submit_app" class="iCIMS_PrimaryButton" value="Submit Application" />
      </div>
    </form>
  </div>
</div>
