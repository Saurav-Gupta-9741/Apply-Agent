<!-- Real application form, saved by e2e/coverage.spec.ts (scripts and styles removed). -->
<h1>Senior Cyber Systems Security Engineer</h1>
<div class="gd-application-container">
  <form id="gd-form">
    <div class="gd-panel">
      <h3>Candidate Profile</h3>
      <div class="gd-field">
        <label for="gd-fn">First Name *</label>
        <input type="text" id="gd-fn" name="candidate.firstName" required />
      </div>
      <div class="gd-field">
        <label for="gd-ln">Last Name *</label>
        <input type="text" id="gd-ln" name="candidate.lastName" required />
      </div>
      <div class="gd-field">
        <label for="gd-email">Email *</label>
        <input type="email" id="gd-email" name="candidate.email" required />
      </div>
      <div class="gd-field">
        <label for="gd-phone">Phone *</label>
        <input type="tel" id="gd-phone" name="candidate.phone" required />
      </div>
      <div class="gd-field">
        <label for="gd-resume">Resume / CV *</label>
        <input type="file" id="gd-resume" name="candidate.resume" required />
      </div>
    </div>

    <div class="gd-panel">
      <h3>Defense & Export Control Compliance (ITAR/EAR)</h3>
      <fieldset>
        <legend>Are you a United States Citizen? (Mandatory for ITAR clearance roles) *</legend>
        <label><input type="radio" name="us_citizen" value="yes" required /> Yes</label>
        <label><input type="radio" name="us_citizen" value="no" /> No</label>
      </fieldset>
      <div class="gd-field">
        <label for="gd-clearance">Do you currently hold an active DoD Secret or Top Secret clearance? *</label>
        <select id="gd-clearance" name="security_clearance" required>
          <option value="">Select Clearance Level</option>
          <option value="none">None</option>
          <option value="confidential">Confidential</option>
          <option value="secret">Secret</option>
          <option value="top_secret">Top Secret</option>
          <option value="ts_sci">Top Secret / SCI</option>
        </select>
      </div>
      <div class="gd-field">
        <label for="gd-employer">Current Employer / Organization Name</label>
        <input type="text" id="gd-employer" name="currentCompany" />
      </div>
      <div class="gd-field">
        <label for="gd-start">Earliest date available to start (Notice Period) *</label>
        <input type="text" id="gd-start" name="noticePeriod" placeholder="e.g. 30 days" required />
      </div>
    </div>

    <div class="gd-button-row">
      <button type="submit" class="gd-btn">Submit Application</button>
    </div>
  </form>
</div>
