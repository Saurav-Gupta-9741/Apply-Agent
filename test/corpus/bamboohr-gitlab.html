<!-- Real application form, saved by e2e/coverage.spec.ts (scripts and styles removed). -->
<h1>Staff Backend Engineer - Database Scalability</h1>
<div class="BambooHR-ATS-Form">
  <form id="gitlab-bamboo">
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-fn">First Name *</label>
      <input type="text" id="gl-fn" name="first_name" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-ln">Last Name *</label>
      <input type="text" id="gl-ln" name="last_name" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-email">Email *</label>
      <input type="email" id="gl-email" name="email" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-phone">Phone *</label>
      <input type="tel" id="gl-phone" name="phone" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-loc">Location (Country and City) *</label>
      <input type="text" id="gl-loc" name="location" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-github">GitHub Profile URL *</label>
      <input type="url" id="gl-github" name="github_profile" required placeholder="https://gitlab.com/... or https://github.com/..." />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-resume">Resume upload *</label>
      <input type="file" id="gl-resume" name="resume" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-comp">Compensation Expectations (Annual USD or Local Currency) *</label>
      <input type="text" id="gl-comp" name="salary_expectations" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-async">Tell us about your experience with asynchronous remote communication *</label>
      <textarea id="gl-async" name="async_experience" required rows="3"></textarea>
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="gl-notice">Notice period *</label>
      <input type="text" id="gl-notice" name="notice_period" required placeholder="e.g. 1 month" />
    </div>
    <div class="BambooHR-ATS-Form-Submit">
      <button type="submit" class="BambooHR-ATS-Form-Button">Submit Application</button>
    </div>
  </form>
</div>
