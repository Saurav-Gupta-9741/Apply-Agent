<!-- Real application form, saved by e2e/coverage.spec.ts (scripts and styles removed). -->
<h1>Senior Gameplay Programmer - Next-Gen Engine</h1>
<div class="ubisoft-sr-portal">
  <form class="application-form" id="ubisoft-apply">
    <div class="form-group">
      <label for="ubi-first">First Name *</label>
      <input type="text" id="ubi-first" name="firstName" required />
    </div>
    <div class="form-group">
      <label for="ubi-last">Last Name *</label>
      <input type="text" id="ubi-last" name="lastName" required />
    </div>
    <div class="form-group">
      <label for="ubi-email">Email *</label>
      <input type="email" id="ubi-email" name="email" required />
    </div>
    <div class="form-group">
      <label for="ubi-phone">Phone *</label>
      <input type="tel" id="ubi-phone" name="phone" required />
    </div>
    <div class="form-group">
      <label for="ubi-portfolio">Portfolio Website / Demo Reel Link *</label>
      <input type="url" id="ubi-portfolio" name="portfolioUrl" required placeholder="https://..." />
    </div>
    <div class="form-group">
      <label for="ubi-github">GitHub Profile URL</label>
      <input type="url" id="ubi-github" name="githubUrl" placeholder="https://github.com/..." />
    </div>
    <div class="form-group">
      <label for="ubi-resume">Resume upload *</label>
      <input type="file" id="ubi-resume" name="resume" required />
    </div>
    <div class="form-group">
      <label for="ubi-exp">Years of C++ experience *</label>
      <input type="number" id="ubi-exp" name="cpp_years" required min="0" />
    </div>
    <div class="form-group">
      <label for="ubi-auth">Are you legally authorized to work in Canada or France? *</label>
      <select id="ubi-auth" name="work_auth" required>
        <option value="">Select...</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="form-group">
      <label for="ubi-salary">Expected annual compensation *</label>
      <input type="text" id="ubi-salary" name="desired_salary" required />
    </div>
    <div class="form-group">
      <button type="submit" class="ubi-btn">Submit Application</button>
    </div>
  </form>
</div>
