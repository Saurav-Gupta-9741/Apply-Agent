<!-- Real application form, saved by e2e/coverage.spec.ts (scripts and styles removed). -->
<h1>Staff Systems Engineer - Global Payment Network</h1>
<div class="smartrecruiters-wrapper">
  <form class="application-form" id="st-apply">
    <div class="form-group">
      <label for="sr-fname">First Name *</label>
      <input type="text" id="sr-fname" name="firstName" required class="form-control" />
    </div>
    <div class="form-group">
      <label for="sr-lname">Last Name *</label>
      <input type="text" id="sr-lname" name="lastName" required class="form-control" />
    </div>
    <div class="form-group">
      <label for="sr-email">Email *</label>
      <input type="email" id="sr-email" name="email" required class="form-control" />
    </div>
    <div class="form-group">
      <label for="sr-phone">Phone *</label>
      <input type="tel" id="sr-phone" name="phone" required class="form-control" />
    </div>
    <div class="form-group">
      <label for="sr-resume">Resume / CV *</label>
      <div class="dropzone" data-testid="dropzone">
        <input type="file" id="sr-resume" name="resume" required />
      </div>
    </div>
    <div class="form-group">
      <label for="sr-linkedin">LinkedIn URL</label>
      <input type="url" id="sr-linkedin" name="linkedinUrl" class="form-control" />
    </div>
    <div class="form-group">
      <fieldset>
        <legend>Are you legally authorized to work in the United States? *</legend>
        <label><input type="radio" name="work_auth_us" value="yes" required /> Yes</label>
        <label><input type="radio" name="work_auth_us" value="no" /> No</label>
      </fieldset>
    </div>
    <div class="form-group">
      <fieldset>
        <legend>Will you require visa sponsorship for employment authorization? *</legend>
        <label><input type="radio" name="visa_sponsorship" value="yes" required /> Yes</label>
        <label><input type="radio" name="visa_sponsorship" value="no" /> No</label>
      </fieldset>
    </div>
    <div class="form-group">
      <label for="sr-hear">How did you hear about Visa? *</label>
      <select id="sr-hear" name="referralSource" required class="form-control">
        <option value="">Select option</option>
        <option value="careers">Visa Careers Site</option>
        <option value="linkedin">LinkedIn</option>
        <option value="referral">Employee Referral</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" id="btn-submit">Submit Application</button>
    </div>
  </form>
</div>
