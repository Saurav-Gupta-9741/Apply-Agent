<!-- Real application form, saved by e2e/coverage.spec.ts (scripts and styles removed). -->
<h1>Infrastructure Reliability Engineer</h1>
<div class="BambooHR-ATS-Form">
  <form id="bamboo-form">
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-fn">First Name *</label>
      <input type="text" id="strp-fn" name="first_name" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-ln">Last Name *</label>
      <input type="text" id="strp-ln" name="last_name" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-email">Email *</label>
      <input type="email" id="strp-email" name="email" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-phone">Phone *</label>
      <input type="tel" id="strp-phone" name="phone" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-street">Street Address</label>
      <input type="text" id="strp-street" name="street" />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-city">City *</label>
      <input type="text" id="strp-city" name="city" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-resume">Resume / CV *</label>
      <input type="file" id="strp-resume" name="resume" required />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-start">Earliest start date / Notice period *</label>
      <input type="text" id="strp-start" name="start_date" required placeholder="e.g. 1 month notice" />
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-auth">Are you legally authorized to work in Ireland / EU? *</label>
      <select id="strp-auth" name="work_auth_eu" required>
        <option value="">Select an option</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-mode">Preferred work mode</label>
      <select id="strp-mode" name="work_mode">
        <option value="remote">Remote</option>
        <option value="hybrid">Hybrid</option>
        <option value="in_office">In Office</option>
      </select>
    </div>
    <div class="BambooHR-ATS-Form-Field">
      <label class="BambooHR-ATS-Form-Label" for="strp-why">Why Stripe? Tell us about your motivation *</label>
      <textarea id="strp-why" name="motivation" required rows="3"></textarea>
    </div>
    <div class="BambooHR-ATS-Form-Submit">
      <button type="submit" class="BambooHR-ATS-Form-Button">Submit Application</button>
    </div>
  </form>
</div>
