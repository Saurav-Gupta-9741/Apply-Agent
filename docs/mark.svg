    <stop offset="0" stop-color="#6E70F8"/><stop offset=".55" stop-color="#8E6CF7"/><stop offset="1" stop-color="#AE6BF3"/>
  </linearGradient>
  <radialGradient id="aa-shine" cx=".28" cy=".1" r=".95">
